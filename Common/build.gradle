plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

configurations {
    shadowBundle
}

// pkSubproj {
//     platform = "common"
//     pkPublish = false
// }

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    compileOnly "blue.endless:jankson:$rootProject.jankson_version"
    shadowBundle "blue.endless:jankson:$rootProject.jankson_version"

    // JSpecify will provide the standardized Java nullability annotations
    // Minecraft removed FieldsAreNonnullByDefault and MethodsREturnNonnullByDefault
    api "org.jspecify:jspecify:1.0.0"
}

shadowJar {
    relocate "blue.endless.jankson", "${rootProject.maven_group}.paucal.shadowed.blue.endless.jankson"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "shadow"
}